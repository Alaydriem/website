version: '3.3'
services:
  vite:
    image: node:16-alpine
    volumes:
      - ${PWD-.}:/var/www
    ports:
      - "5173:5173"
      - "8080:8080"
    command: |
      sh -c "yarn set version berry; yarn install; yarn run dev"
    working_dir: /var/www/themes/alaydriem
    environment:
      DEBUG: 1

  hugo:
    image: jojomi/hugo
    ports:
      - "1313:1313"
    volumes:
      - ${PWD-.}:/var/www
    working_dir: /var/www
    command: |
      hugo server -t alaydriem --bind 0.0.0.0 --enableGitInfo --noHTTPCache --log --renderToDisk

volumes:
  nodejs: