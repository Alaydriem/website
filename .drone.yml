---
kind: pipeline
type: docker
name: default

steps:
  - name: vite
    image: node:16-alpine
    commands:
      - apk add --no-cache xxd perl-utils
      - cd themes/alaydriem
      - yarn install
      - yarn run build
      - yarn run get-videos
  - name: hugo
    image: jojomi/hugo
    commands:
      - HUGO_ENV="production" hugo
    depends_on:
      - vite
  - name: deploy
    image: plugins/s3-sync
    depends_on:
      - vite
      - hugo
    settings:
      bucket:
        from_secret: AWS_BUCKET
      endpoint:
        from_secret: AWS_HOST
      access_key:
        from_secret: AWS_ACCESS_KEY_ID
      secret_key:
        from_secret: AWS_SECRET_ACCESS_KEY
      source: public
      path_style: true
      target: /
      delete: true
      acl:
        "*": public-read
  - name: nginx
    depends_on:
      - deploy
    image: appleboy/drone-ssh
    settings:
      host:
        from_secret: SSH_HOST
      username:
        from_secret: SSH_USERNAME
      key:
        from_secret: SSH_KEY
      port: 22
      script:
        - sudo /bin/systemctl restart nginx
  