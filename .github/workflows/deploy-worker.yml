name: Deploy worker

# The live-status Worker is deployed by CI, never by hand, so what is on the
# edge is always what is on master.
#
# No pull_request trigger. Fork pull requests cannot read secrets, and a fork
# must never be able to deploy to the account.
on:
  push:
    branches: [master]
    # The site and the Worker are independent deployables. Publishing the
    # Worker on every content refresh would create a new version several times
    # a day for a file that had not changed.
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

concurrency:
  # Its own group. Two concurrent wrangler deploys to one script race; the site
  # publish is unrelated and must not be blocked by this.
  group: worker-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install
        working-directory: worker
        run: npm ci

      # The state logic is shared with the browser client's tests and runs at
      # the repository root. Failing here stops a broken TTL reaching the edge.
      - name: Unit tests
        run: |
          npm ci
          npm run test

      - name: Deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # Pushed on every deploy so the GitHub secret is the single source of
      # truth: rotating the token means changing it here and re-running this
      # workflow, with nothing to remember on the Cloudflare side.
      #
      # This runs after deploy because a secret cannot be set on a script that
      # does not exist yet. It creates a new version each time, which is noise
      # worth accepting for having one place to rotate.
      - name: Set the push token
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LIVE_TOKEN: ${{ secrets.LIVE_STATUS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${LIVE_TOKEN}" ]; then
            echo "LIVE_STATUS_TOKEN is not set. The Worker will reject every push with 401." >&2
            exit 1
          fi
          printf '%s' "$LIVE_TOKEN" | npx wrangler secret put LIVE_TOKEN

      # "Deployed" is not the same as "working". A route that does not match
      # fails silently: the request falls through to GitHub Pages and 404s,
      # and the badge simply never lights up. Verify against the real domain.
      - name: Verify the endpoint is live
        run: |
          set -euo pipefail

          # Propagation is quick but not instant.
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/live.json -w '%{http_code}' https://www.alaydriem.com/api/live || true)
            [ "$code" = "200" ] && break
            echo "attempt ${attempt}: got ${code}, retrying"
            sleep 6
          done

          echo "GET  -> ${code}"
          cat /tmp/live.json; echo
          [ "$code" = "200" ] || { echo 'endpoint did not return 200'; exit 1; }

          # It must be the Worker answering, not a stray HTML 404 page that
          # happens to return 200.
          node -e 'const s=require("fs").readFileSync("/tmp/live.json","utf8");const j=JSON.parse(s);if(typeof j.live!=="boolean")throw new Error("no boolean live field: "+s)'

          # An unauthenticated push must be refused. This asserts the token
          # check is actually wired up, and changes no state.
          auth=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'content-type: application/json' \
            --data '{"live":true,"url":"https://example.com"}' \
            https://www.alaydriem.com/api/live || true)
          echo "POST without token -> ${auth}"
          [ "$auth" = "401" ] || { echo 'unauthenticated push was not rejected'; exit 1; }
