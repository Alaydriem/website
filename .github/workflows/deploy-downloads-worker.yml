name: Deploy downloads worker

# The world-download passthrough Worker is deployed by CI, never by hand, so
# what is on the edge is always what is on master.
#
# Separate from deploy-worker.yml on purpose. That one publishes the live
# status Worker, pushes its token and probes /api/live. The two are independent
# scripts on independent routes, and a change to one must not republish the
# other.
#
# No pull_request trigger. Fork pull requests cannot read secrets, and a fork
# must never be able to deploy to the account.
on:
  push:
    branches: [master]
    paths:
      - 'worker-downloads/**'
      - '.github/workflows/deploy-downloads-worker.yml'
  workflow_dispatch:

concurrency:
  # Its own group. Two concurrent wrangler deploys to one script race, and
  # neither the site publish nor the live Worker publish is related to this.
  group: downloads-worker-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: worker-downloads/package-lock.json

      - name: Install
        working-directory: worker-downloads
        run: npm ci

      # The path and header rules are tested at the repository root, next to
      # the site's own unit tests. Failing here stops a broken rule reaching
      # the edge, where it would 404 every download URL printed on YouTube.
      - name: Unit tests
        run: |
          npm ci
          npm run test

      - name: Deploy
        working-directory: worker-downloads
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # "Deployed" is not the same as "working". A route that does not match
      # fails silently: the request falls through to GitHub Pages and 404s,
      # which is the exact breakage this Worker exists to fix. Verify against
      # the real domain.
      - name: Verify a download is served
        env:
          # A file that is expected to stay in the bucket. If it is ever
          # removed, change this rather than deleting the check.
          PROBE: /world-downloads/shroomlight-farm/ShroomLightFarm.mcstructure
        run: |
          set -euo pipefail

          # Propagation is quick but not instant.
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -r 0-1023 \
              "https://www.alaydriem.com${PROBE}" || true)
            # Written as an if, not an || && chain: under errexit a chain whose
            # last command does not run takes the failing test's status and
            # kills the step.
            if [ "$code" = "200" ] || [ "$code" = "206" ]; then break; fi
            echo "attempt ${attempt}: got ${code}, retrying"
            sleep 6
          done

          curl -sS -D /tmp/head.txt -o /tmp/body.bin -r 0-1023 \
            "https://www.alaydriem.com${PROBE}"
          cat /tmp/head.txt

          # A range request must come back as a partial, which is what makes a
          # large world file resumable.
          grep -qiE '^HTTP/[0-9.]+ 206' /tmp/head.txt \
            || { echo 'range request was not answered with 206'; exit 1; }

          # The two headers that are the whole reason this is a Worker and not
          # a redirect rule. Without them a browser renders the file instead of
          # saving it.
          grep -qi '^content-type: application/octet-stream' /tmp/head.txt \
            || { echo 'content-type was not corrected'; exit 1; }
          grep -qi '^content-disposition: attachment; filename="ShroomLightFarm.mcstructure"' /tmp/head.txt \
            || { echo 'content-disposition was not set'; exit 1; }

          [ -s /tmp/body.bin ] || { echo 'no bytes returned'; exit 1; }

      - name: Verify an unknown download is refused
        run: |
          set -euo pipefail

          # A path under the prefix that names no object must 404, not 502 and
          # not a stray success.
          missing=$(curl -s -o /dev/null -w '%{http_code}' \
            https://www.alaydriem.com/world-downloads/no-such-farm.mcworld || true)
          echo "unknown object -> ${missing}"
          [ "$missing" = "404" ] || { echo 'unknown object did not 404'; exit 1; }

          # And the route must not have swallowed the rest of the site.
          home=$(curl -s -o /dev/null -w '%{http_code}' https://www.alaydriem.com/ || true)
          echo "home page -> ${home}"
          [ "$home" = "200" ] || { echo 'the site home page is not 200'; exit 1; }
